name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Compile-gate for the reconstructed bootrom source: re.elf must build
  # warning-free and define exactly the functions listed in
  # .expected-symbols. Not a flashable-image check, see bootrom/README.
  bootrom:
    name: bootrom ${{ matrix.die }} compile-gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        die: [na51089]
    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build bootrom/${{ matrix.die }}/re
        run: |
          make -C bootrom/${{ matrix.die }} build
          test -f bootrom/${{ matrix.die }}/re.elf

      # Drift either way fails; updating .expected-symbols is a deliberate,
      # reviewable act. Compiler clones (.part.N, .constprop.N, .isra.N,
      # .cold) are dropped: they differ between gcc versions.
      - name: Check the symbol set
        run: |
          arm-none-eabi-objdump -t bootrom/${{ matrix.die }}/re.elf \
              | grep ' F ' | awk '{ print $NF }' \
              | grep -v '\.part\.\|\.constprop\.\|\.isra\.\|\.cold' \
              | LC_ALL=C sort -u > /tmp/actual-symbols
          diff -u bootrom/${{ matrix.die }}/.expected-symbols /tmp/actual-symbols
          echo "ok: $(wc -l < /tmp/actual-symbols) functions"

      - name: Scripts parse
        run: for s in bootrom/scripts/*.sh; do sh -n "$s"; done

  # Every libraries/sensor/na51089 driver must build against the kernel
  # OpenIPC ships for NT9856x, configured the way OpenIPC firmware does it.
  sensors:
    name: sensors ${{ matrix.chiparch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, so that this repo's CI changes only when this repo does.
          # kernel_sha: openipc/linux novatek-nt9856x; firmware_sha:
          # openipc/firmware, the source of kernel_config.
          - chiparch: na51089
            kernel_sha: e75a4165c34b24c4191fe285fe922a756f8fa01d
            firmware_sha: 11d097ca473e2975f5b326cf7eda163d96d19ce2
            kernel_config: br-ext-chip-novatek/board/nt9856x/nt98566.generic.config
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              gcc-arm-linux-gnueabihf bc bison flex libssl-dev

      - name: Fetch and configure the kernel
        run: |
          git init -q ../linux
          git -C ../linux fetch -q --depth 1 https://github.com/openipc/linux ${{ matrix.kernel_sha }}
          git -C ../linux checkout -q FETCH_HEAD
          curl -fsSL -o ../linux/.config \
              https://raw.githubusercontent.com/openipc/firmware/${{ matrix.firmware_sha }}/${{ matrix.kernel_config }}
          cd ../linux
          echo "kernel $(git rev-parse HEAD), config from firmware ${{ matrix.firmware_sha }}"
          # The signed-regdb keyring pulls in extract-cert, which does not
          # build against current OpenSSL; sensors do not need either.
          ./scripts/config --disable CFG80211 --disable SYSTEM_TRUSTED_KEYRING
          # -fcommon: 4.19's dtc predates GCC 10's -fno-common default.
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon olddefconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- HOSTCFLAGS=-fcommon -j$(nproc) modules_prepare

      - name: Build libraries/
        run: |
          make -C libraries CHIPARCH=${{ matrix.chiparch }} \
              KERNELDIR=$PWD/../linux CROSS_COMPILE=arm-linux-gnueabihf-

      - name: One module per sensor directory
        run: |
          want=$(ls -d libraries/sensor/${{ matrix.chiparch }}/*/Kbuild | wc -l)
          got=$(find libraries/sensor/${{ matrix.chiparch }} -name 'nvt_sen_*.ko' | wc -l)
          echo "built $got of $want"
          test "$got" -eq "$want"
